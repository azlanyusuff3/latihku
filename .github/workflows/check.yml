name: LatihKu checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check.mjs
      - run: node tests/general.mjs
      - run: node tests/general-worker.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: General browser and offline regression
        run: |
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          node tests/general-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-browser-screenshots
          path: .general-build-cache/latihku-general-*.png
          if-no-files-found: ignore
